version: 2

builds:
  - id: azstore
    main: ./cmd/azstore
    binary: azstore
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  - repository:
      owner: Linux-DEX
      name: homebrew-tap
    homepage: https://github.com/Linux-DEX/azstorecli
    description: Terminal Azure Storage Explorer fused with Azurite and Functions Core Tools

checksum:
  name_template: checksums.txt
